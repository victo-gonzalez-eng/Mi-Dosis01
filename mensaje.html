<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Enviar Mensaje | MiDosis</title>

<link rel="stylesheet"
href="mensaje.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="contenedor">

<!--==========================
        ENCABEZADO
===========================-->

<header>

<button
id="volver"
class="btn-volver">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>

Enviar mensaje

</h2>

<div class="espacio"></div>

</header>

<!--==========================
      CABECERA
===========================-->

<section class="cabecera">

<img
src="imag.png"
alt="Mensaje">

<h1>

Contáctanos

</h1>

<p>

Envíanos tu consulta y nuestro equipo de soporte responderá lo antes posible.

</p>

</section>

<!--==========================
      FORMULARIO
===========================-->

<section class="formulario">

<form id="formMensaje">

<!-- Nombre -->

<div class="grupo">

<label>

Nombre completo

</label>

<input
type="text"
id="nombre"
placeholder="Ingrese su nombre completo"
required>

</div>

<!-- Correo -->

<div class="grupo">

<label>

Correo electrónico

</label>

<input
type="email"
id="correo"
placeholder="correo@ejemplo.com"
required>

</div>

<!-- Asunto -->

<div class="grupo">

<label>

Asunto

</label>

<select
id="asunto"
required>

<option value="">

Seleccione una opción

</option>

<option>

Problema con la aplicación

</option>

<option>

Recordatorios

</option>

<option>

Medicamentos

</option>

<option>

Cuenta

</option>

<option>

Otro

</option>

</select>

</div>

<!-- Mensaje -->

<div class="grupo">

<label>

Mensaje

</label>

<textarea

id="mensaje"

rows="6"

maxlength="500"

placeholder="Escriba aquí su mensaje..."

required>

</textarea>

<div class="contador">

<span id="contador">

0

</span>

/

500 caracteres

</div>

</div>

<!-- Adjuntar archivo -->

<div class="grupo">

<label>

Adjuntar captura (Opcional)

</label>

<input

type="file"

id="archivo"

accept="image/*">

</div>

<!-- BOTONES -->

<div class="botones">

<button

type="submit"

class="btnEnviar">

<i class="fa-solid fa-paper-plane"></i>

Enviar mensaje

</button>

<a

href="soporte.html"

class="btnCancelar">

Cancelar

</a>

</div>

</form>

</section>

</div>

<!--==========================
      BARRA INFERIOR
===========================-->

<nav class="bottom">

<a href="dashboard.html">

<i class="fa-solid fa-house"></i>

<span>Inicio</span>

</a>

<a href="medicamentos.html">

<i class="fa-solid fa-capsules"></i>

<span>Medicamentos</span>

</a>

<a href="historial.html">

<i class="fa-solid fa-clock-rotate-left"></i>

<span>Historial</span>

</a>

<a href="perfil.html">

<i class="fa-solid fa-user"></i>

<span>Perfil</span>

</a>

</nav>

<script src="mensaje.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cambiar Contraseña | MiDosis</title>

    <link rel="stylesheet"
        href="cambiar_password.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="contenedor">

<!--==========================
        ENCABEZADO
===========================-->

<header>

<a href="perfil.html" class="volver">

<i class="fa-solid fa-arrow-left"></i>

</a>

<h2>Cambiar contraseña</h2>

</header>

<!--==========================
        LOGO
===========================-->

<section class="logo">

<img src="log 1.png" alt="MiDosis">

<h3>Seguridad de la cuenta</h3>

<p>

Actualiza tu contraseña para mantener protegida tu información.

</p>

</section>

<!--==========================
        FORMULARIO
===========================-->

<form id="formPassword">

<!-- Contraseña actual -->

<label>

Contraseña actual

</label>

<div class="input">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="actual"
placeholder="Ingrese su contraseña actual"
required>

<i class="fa-solid fa-eye mostrar"
id="verActual"></i>

</div>

<!-- Nueva contraseña -->

<label>

Nueva contraseña

</label>

<div class="input">

<i class="fa-solid fa-key"></i>

<input
type="password"
id="nueva"
placeholder="Ingrese la nueva contraseña"
required>

<i class="fa-solid fa-eye mostrar"
id="verNueva"></i>

</div>

<!-- Confirmar -->

<label>

Confirmar contraseña

</label>

<div class="input">

<i class="fa-solid fa-shield-halved"></i>

<input
type="password"
id="confirmar"
placeholder="Repita la nueva contraseña"
required>

<i class="fa-solid fa-eye mostrar"
id="verConfirmar"></i>

</div>

<!-- Requisitos -->

<div class="requisitos">

<h4>La contraseña debe contener:</h4>

<ul>

<li id="caracteres">

<i class="fa-solid fa-circle"></i>

Mínimo 8 caracteres

</li>

<li id="mayuscula">

<i class="fa-solid fa-circle"></i>

Una letra mayúscula

</li>

<li id="minuscula">

<i class="fa-solid fa-circle"></i>

Una letra minúscula

</li>

<li id="numero">

<i class="fa-solid fa-circle"></i>

Un número

</li>

</ul>

</div>

<!-- Botones -->

<div class="botones">

<button
type="submit"
class="guardar">

Guardar cambios

</button>

<button
type="button"
class="cancelar"
onclick="window.location.href='perfil.html'">

Cancelar

</button>

</div>

</form>

</div>

<script src="cambiar_password.js"></script>

</body>

</html>
